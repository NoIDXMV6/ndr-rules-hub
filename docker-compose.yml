# ─────────────────────────────────────────────────────────────────────────────
# NDR&DNS Rules HUB — docker-compose
# Сервис управления источниками правил Snort/Suricata + экспорт в Clear NDR
# ─────────────────────────────────────────────────────────────────────────────

services:
  rules-hub:
    build:
      context: .
      dockerfile: Dockerfile
      # Зеркала npm для этапа deps выбираются АВТОМАТИЧЕСКИ (v1.36.1,
      # scripts/bun-install.sh): предпроверка лёгким GET /ms (таймаут 15с),
      # порядок попыток — по возрастанию времени ответа, деградировавшие
      # (>3000мс на запрос) — в конец очереди, не ответившие исключаются.
      # Кандидаты по умолчанию: registry.npmjs.org → registry.npmmirror.com →
      # npm-mirror.gitverse.ru. bun.lock не содержит URL реестра,
      # --frozen-lockfile с любым зеркалом совместим (integrity по lockfile).
      # Ручки (.env или build-arg):
      #   NPM_REGISTRY          — основное зеркало (проверяется первым, но в
      #                           очередь встаёт по фактической скорости);
      #   BUN_REGISTRIES        — свой полный список зеркал («url1 url2 …»);
      #   BUN_INSTALL_TIMEOUT   — предохранитель bun install, секунды НА
      #                           ПОПЫТКУ (дефолт 900, kill-after 30с);
      #   BUN_SLOW_MS           — порог деградации зеркала (дефолт 3000мс).
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        BUN_INSTALL_TIMEOUT: ${BUN_INSTALL_TIMEOUT:-900}
    image: ndr-rules-hub:latest
    container_name: ndr-rules-hub
    restart: unless-stopped
    ports:
      - "3080:3000"
    environment:
      # Oinkcode аккаунта snort.org (можно также задать через UI → Настройки)
      - OINKCODE=${OINKCODE:-}
      # Oinkcode ET Pro (Proofpoint) — СВОЙ код, не совпадает со снортовским;
      # подставляется только в источник «ET Pro Ruleset». Можно также задать
      # через UI → Настройки → «Oinkcode ET Pro (Proofpoint)»
      - ETPRO_OINKCODE=${ETPRO_OINKCODE:-}
      - DATABASE_URL=file:/app/data/hub.db
      - RULES_DATA_DIR=/app/data
      - WG_CONFIG_DIR=/app/data/wireguard
      # Глобальный таймаут проверки/докатки схемы БД при старте (db-heal,
      # секунды). На огромной БД / медленном диске увеличьте; при превышении
      # БД НЕ стирается — сервер стартует с существующей БД (код 2).
      - DB_HEAL_TIMEOUT=${DB_HEAL_TIMEOUT:-300}
      # Порог размера БД (MB), выше которого скан целостности при старте
      # ПРОПУСКАЕТСЯ (v1.36.2): на большой БД скан идёт минутами и раньше
      # обрывал докатку схемы (сервер стартовал на устаревшей схеме — P2022).
      # Докатка выполняется всегда; полный скан — NDR_DB_FULL_CHECK=1.
      - DB_HEAL_CHECK_SKIP_MB=${DB_HEAL_CHECK_SKIP_MB:-400}
      - TZ=${TZ:-Europe/Moscow}
      # Редакция: community (по умолчанию, без аутентификации) | enterprise
      # (многопользовательский режим: регистрация, верификация, личный кабинет)
      - NDR_EDITION=${NDR_EDITION:-community}
    volumes:
      # данные сервиса: БД, кэш архивов, итоговые файлы, WireGuard-конфиги,
      # метаданные прогонов обновления Clear NDR, файлы окружения Gotify
      - ./data:/app/data
      # docker.sock (read-only): список контейнеров на «Обзоре», автоочистка
      # OpenSearch через docker exec, развёртывание своего сервера Gotify.
      # Если это не нужно — строку можно убрать (мониторинг покажет подсказку).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # при экспорте режиме local-path можно указать каталог самого Clear NDR:
      # - /srv/clearndr/rules-import:/mnt/clearndr
      # Раздел «Обновление Clear NDR» и «Дашборды OpenSearch»: по умолчанию
      # работает по SSH (скрипт запускается на хосте) — ничего докручивать не
      # нужно (укажите хост/ключ на вкладке). Режим «local» (хаб в контейнере
      # на хосте с Clear NDR, скрипты прямо из контейнера): docker.sock уже
      # смонтирован выше — раскомментируйте только каталог инстанса:
      #   - /opt/ClearNDR:/opt/ClearNDR      # путь на хосте = путь в контейнере
      # docker CLI, python3 и stamusctl (amd64) уже входят в образ; healthUrl
      # укажите доступный из контейнера (например https://172.17.0.1/);
      # OpenSearch хаб найдёт сам (172.17.0.1:9200 / docker exec) или укажите
      # «OpenSearch URL» во вкладке «Дашборды OpenSearch».
    # WireGuard: нужны права NET_ADMIN и TUN-устройство
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      # обязательно для full-tunnel конфигов (AllowedIPs 0.0.0.0/0): wg-quick
      # пишет этот ключ через sysctl, а /proc/sys в контейнере read-only —
      # без этой строки up падает с «sysctl: permission denied on key»
      - net.ipv4.conf.all.src_valid_mark=1
    # ЛЁГКИЙ healthcheck (/api/ping, JSON без обращения к БД): фоновая сборка
    # правил занимает единственную SQLite-коннекцию (connection_limit=1) —
    # тяжёлый /api/dashboard в это окно не укладывался в таймаут, и контейнер
    # помечался unhealthy на время нормальной сборки. Диагностика БД:
    #   curl http://127.0.0.1:3080/api/health   (всегда 200 с отчётом)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # Опционально: локальный Clear NDR (community) рядом, для end-to-end проверки
  # экспорта. Раскомментируйте при необходимости — см. https://docs.clearndr.io
  # clearndr:
  #   image: stamusnetworks/clear-ndr:latest
  #   container_name: clearndr
  #   restart: unless-stopped
  #   ports:
  #     - "3380:80"
  #   volumes:
  #     - clearndr-data:/data
  #   cap_add:
  #     - NET_ADMIN
  #     - SYS_NICE

