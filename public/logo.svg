<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NDR Rules Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0065a8"/>
      <stop offset="1" stop-color="#003d68"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- подложка -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="44" y="44" width="424" height="424" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="10"/>

  <!-- щит -->
  <path d="M256 92 C 288 114, 336 130, 380 140 L 380 262 C 380 346, 326 406, 256 434 C 186 406, 132 346, 132 262 L 132 140 C 176 130, 224 114, 256 92 Z" fill="url(#shield)"/>

  <!-- строки правил -->
  <rect x="184" y="196" width="144" height="28" rx="14" fill="#ffffff"/>
  <rect x="184" y="244" width="112" height="28" rx="14" fill="#ffffff" opacity="0.93"/>
  <rect x="184" y="292" width="128" height="28" rx="14" fill="#ffffff" opacity="0.86"/>

  <!-- пульс-узел (живое обновление правил) -->
  <circle cx="312" cy="210" r="19" fill="#a7f3d0" stroke="#065f46" stroke-width="7"/>
  <circle cx="312" cy="210" r="6" fill="#065f46"/>

  <!-- узлы сети внизу щита -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round">
    <line x1="212" y1="366" x2="256" y2="348"/>
    <line x1="256" y1="348" x2="300" y2="366"/>
  </g>
  <circle cx="212" cy="366" r="11" fill="#ffffff"/>
  <circle cx="256" cy="348" r="11" fill="#ffffff"/>
  <circle cx="300" cy="366" r="11" fill="#ffffff"/>
</svg>
